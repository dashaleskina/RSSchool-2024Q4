<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Shop</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="icon" href="/christmas-shop/images/snowflake.ico" sizes="any">
    <link
      rel="icon"
      href="/christmas-shop/images/snowflake.svg"
      type="image/svg+xml">
    <link rel="apple-touch-icon" href="/christmas-shop/images/snowflake.png">
  </head>

  <body>
    <header class="header">
      <div class="header__container">
        <a href="#" class="logo">
          <img src="images/snowflake.svg" alt="Snowflake logo">
          <span>the gifts</span>
        </a>
        <nav class="nav">
          <a href="#gifts">gifts</a>
          <a href="#about">about</a>
          <a href="#best">best</a>
          <a href="#contacts">contacts</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero__overlay-ball"></div>
        <div class="hero__overlay-snow"></div>

        <div class="hero__container">
          <p class="hero_paragraph">merry christmas</p>
          <h1 class="hero_header">
            Gift yourself<br>the magic of new<br>possibilities
          </h1>
          <button class="hero_button">Explore Magical Gifts</button>
          <p class="hero_paragraph">
            <span class="hero_no-capitalize">and</span> Happy New Year
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
